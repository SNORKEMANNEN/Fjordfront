    <style>
      /* Fonts: self-hosted, SIL Open Font License (see assets/fonts/OFL-*.txt).
         Saira (variable: width 50–125 %, weight 100–900) · Inter (variable) · JetBrains Mono */
      @font-face { font-family: 'Saira'; font-style: normal; font-display: swap; font-weight: 100 900; font-stretch: 50% 125%; src: url(assets/fonts/saira-latin-wdth-normal.woff2) format('woff2-variations'), url(assets/fonts/saira-latin-wdth-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: 'Saira'; font-style: normal; font-display: swap; font-weight: 100 900; font-stretch: 50% 125%; src: url(assets/fonts/saira-latin-ext-wdth-normal.woff2) format('woff2-variations'), url(assets/fonts/saira-latin-ext-wdth-normal.woff2) format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: 'Inter'; font-style: normal; font-display: swap; font-weight: 100 900; src: url(assets/fonts/inter-latin-wght-normal.woff2) format('woff2-variations'), url(assets/fonts/inter-latin-wght-normal.woff2) format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-display: swap; font-weight: 400; src: url(assets/fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-display: swap; font-weight: 500 600; src: url(assets/fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-display: swap; font-weight: 700 800; src: url(assets/fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2'); }

      /* instant loading screen, painted with the first byte of HTML: a polar night over the fjord.
         Every moving part is a composited transform / opacity animation, so it keeps moving while
         the main thread is busy compiling shaders. The game adopts this element and fills the bar. */
      html, body { margin: 0; height: 100%; background: #05080D; overflow: hidden; }
      #boot { position: fixed; inset: 0; z-index: 50; overflow: hidden; color: #EAF2F8; font-family: 'Saira', 'Arial Narrow', sans-serif; transition: opacity .9s cubic-bezier(.2,.8,.2,1), transform 1.1s cubic-bezier(.2,.8,.2,1); pointer-events: auto; box-sizing: border-box;
        background: radial-gradient(120% 80% at 50% 110%, #0E2233 0%, #08111C 45%, #04070B 100%); }
      #boot.fade { opacity: 0; transform: scale(1.04); }
      #boot *, #boot *::before, #boot *::after { box-sizing: border-box; }
      #boot .sky { position: absolute; inset: 0; pointer-events: none; }
      #boot .stars { position: absolute; inset: -10%; opacity: .7;
        background-image: radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 32% 8%, #cfe 50%, transparent 51%), radial-gradient(1.4px 1.4px at 58% 22%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 77% 12%, #dff 50%, transparent 51%), radial-gradient(1px 1px at 88% 30%, #fff 50%, transparent 51%), radial-gradient(1.2px 1.2px at 22% 34%, #eff 50%, transparent 51%), radial-gradient(1px 1px at 45% 40%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 67% 44%, #cdf 50%, transparent 51%), radial-gradient(1px 1px at 5% 46%, #fff 50%, transparent 51%), radial-gradient(1.3px 1.3px at 94% 6%, #fff 50%, transparent 51%);
        animation: bootTwinkle 6s ease-in-out infinite alternate; }
      #boot .aur { position: absolute; border-radius: 50%; filter: blur(48px); mix-blend-mode: screen; will-change: transform, opacity; }
      #boot .aur.a1 { left: -10%; top: -18%; width: 80%; height: 52%; background: radial-gradient(closest-side, rgba(92,242,198,.55), rgba(92,242,198,0)); animation: bootAur1 14s ease-in-out infinite alternate; }
      #boot .aur.a2 { left: 30%; top: -10%; width: 75%; height: 46%; background: radial-gradient(closest-side, rgba(56,204,255,.42), rgba(56,204,255,0)); animation: bootAur2 17s ease-in-out infinite alternate; }
      #boot .aur.a3 { left: 55%; top: -22%; width: 55%; height: 50%; background: radial-gradient(closest-side, rgba(156,124,255,.38), rgba(156,124,255,0)); animation: bootAur3 19s ease-in-out infinite alternate; }
      #boot .curtain { position: absolute; left: -10%; right: -10%; top: 4%; height: 46%; opacity: .55; will-change: transform; mix-blend-mode: screen; filter: blur(10px);
        background: repeating-linear-gradient(90deg, rgba(92,242,198,0) 0 3%, rgba(92,242,198,.22) 4%, rgba(92,242,198,0) 6% 9%, rgba(56,204,255,.16) 10.5%, rgba(92,242,198,0) 12.5%);
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 35%, #000 55%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0%, #000 35%, #000 55%, transparent 100%);
        animation: bootCurtain 22s linear infinite alternate; }
      #boot svg.ridges { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 52%; }
      #boot .haze { position: absolute; left: 0; right: 0; bottom: 18%; height: 22%; background: linear-gradient(180deg, transparent, rgba(120,190,220,.08) 50%, transparent); filter: blur(6px); animation: bootHaze 12s ease-in-out infinite alternate; will-change: transform; }
      #boot .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.65)); }
      #boot .center { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; text-align: center; width: min(92vw, 980px); }
      #boot .mark { width: 64px; height: 64px; margin-bottom: 18px; animation: bootRise 1.2s cubic-bezier(.16,1,.3,1) both; filter: drop-shadow(0 0 18px rgba(92,242,198,.35)); }
      #boot h1 { margin: 0; font-weight: 800; font-stretch: 125%; font-size: clamp(40px, 7.2vw, 104px); letter-spacing: .14em; line-height: 1; padding-left: .14em;
        background: linear-gradient(180deg, #FFFFFF 0%, #DCEBF5 55%, #8FA6B8 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: bootTrack 1.6s cubic-bezier(.16,1,.3,1) both; }
      #boot .sub { margin-top: 18px; display: flex; gap: 14px; align-items: center; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: .32em; color: rgba(214,232,244,.72); animation: bootRise 1.4s .15s cubic-bezier(.16,1,.3,1) both; }
      #boot .sub i { width: 36px; height: 1px; background: linear-gradient(90deg, transparent, #5CF2C6); display: inline-block; }
      #boot .sub i:last-child { background: linear-gradient(90deg, #9C7CFF, transparent); }
      #boot .foot { position: absolute; left: 6vw; right: 6vw; bottom: 6vh; display: grid; grid-template-columns: 1fr auto; gap: 14px 40px; align-items: end; }
      #boot .tip { max-width: 680px; min-height: 52px; transition: opacity .4s; animation: bootRise 1.4s .3s cubic-bezier(.16,1,.3,1) both; }
      #boot .tip small { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-stretch: 110%; font-size: 10.5px; letter-spacing: .32em; color: #5CF2C6; }
      #boot .tip small::before { content: ''; width: 6px; height: 6px; transform: rotate(45deg); background: #5CF2C6; box-shadow: 0 0 10px #5CF2C6; }
      #boot .tip span { display: block; font-family: 'Inter', system-ui, sans-serif; font-size: 15px; color: rgba(226,238,248,.86); margin-top: 6px; line-height: 1.5; }
      #boot .row { text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: rgba(214,232,244,.6); letter-spacing: .16em; }
      #boot .pct { display: block; font-family: 'Saira', sans-serif; font-weight: 700; font-stretch: 100%; font-size: 44px; color: #EAF2F8; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
      #boot .bstatus { display: block; margin-top: 6px; text-transform: uppercase; }
      #boot .lbar { grid-column: 1 / -1; position: relative; height: 2px; background: rgba(160,205,240,.12); border-radius: 2px; overflow: visible; }
      #boot .lbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, #5CF2C6, #38CCFF 60%, #9C7CFF); border-radius: 2px; transition: transform .5s cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 14px rgba(56,204,255,.6); }
      #boot .lbar b { position: absolute; top: -3px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px 3px rgba(92,242,198,.8); left: 0; transition: left .5s cubic-bezier(.2,.8,.2,1); }
      #boot .lbar s { position: absolute; inset: 0; overflow: hidden; border-radius: 2px; text-decoration: none; }
      #boot .lbar s::after { content: ''; position: absolute; top: 0; bottom: 0; width: 18%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: bootScan 2.2s linear infinite; }
      #boot .corner { position: absolute; top: 4.5vh; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; letter-spacing: .2em; color: rgba(214,232,244,.45); line-height: 1.7; }
      #boot .corner.l { left: 6vw; } #boot .corner.r { right: 6vw; text-align: right; }
      #boot .corner b { color: rgba(234,242,248,.85); font-weight: 600; }
      @keyframes bootAur1 { from { transform: translate3d(-4%, 0, 0) scale(1); opacity: .75; } to { transform: translate3d(8%, 6%, 0) scale(1.15); opacity: 1; } }
      @keyframes bootAur2 { from { transform: translate3d(6%, 4%, 0) scale(1.1); opacity: .6; } to { transform: translate3d(-8%, -2%, 0) scale(.95); opacity: .95; } }
      @keyframes bootAur3 { from { transform: translate3d(0, -4%, 0) scale(.9); opacity: .5; } to { transform: translate3d(-10%, 6%, 0) scale(1.1); opacity: .85; } }
      @keyframes bootCurtain { from { transform: translate3d(-6%, 0, 0) skewX(-8deg); } to { transform: translate3d(6%, 2%, 0) skewX(6deg); } }
      @keyframes bootHaze { from { transform: translate3d(-3%, 0, 0); } to { transform: translate3d(3%, -6%, 0); } }
      @keyframes bootTwinkle { from { opacity: .45; } to { opacity: .85; } }
      @keyframes bootRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes bootTrack { from { opacity: 0; letter-spacing: .5em; filter: blur(8px); } to { opacity: 1; letter-spacing: .14em; filter: none; } }
      @keyframes bootScan { from { transform: translateX(-120%); } to { transform: translateX(620%); } }
      @media (prefers-reduced-motion: reduce) { #boot *, #boot *::before, #boot *::after { animation: none !important; } }
    </style>
  </head>
  <body>
